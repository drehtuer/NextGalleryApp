# SonarCloud analysis, run by CI (.github/workflows/ci.yml). See docs/DESIGN_DECISIONS.md (D41).
sonar.organization=drehtuer
sonar.projectKey=drehtuer_NextGalleryApp

sonar.sources=.
sonar.tests=.
sonar.inclusions=**/src/main/**
sonar.test.inclusions=**/src/test/**,**/src/androidTest/**
sonar.exclusions=**/build/**
sonar.test.exclusions=**/build/**

# Written by ./gradlew coverageReport: line and branch coverage per module.
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/test/jacocoTestReport.xml,**/build/reports/coverage/test/debug/report.xml
# The Gradle convention plugins are an included build without coverage reports. Benchmarks only run on a device.
sonar.coverage.exclusions=build-logic/**,benchmark/**
