# CI builds lint, tests, the debug, test and minified release APKs in one parallel run; 4 GB ran out in D8 there.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Without its own setting the Kotlin daemon takes the Gradle daemon's heap, doubling the memory a build needs.
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# The default since AGP 8; stated here because the keep rules in app/proguard-rules.pro are written for it.
android.enableR8.fullMode=true

kotlin.code.style=official
