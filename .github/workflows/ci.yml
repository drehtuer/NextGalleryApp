name: CI

# Runs on every branch push (direct pushes and merges into main) and on pull requests.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  build:
    needs: wrapper-validation
    runs-on: ubuntu-latest
    env:
      # Only whether the token exists; the token itself goes to the scan step alone. Forks have no secrets.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SonarCloud needs the history to detect new code and to attribute issues.
          fetch-depth: 0

      # Builds inside the same devcontainer image as local development (.devcontainer/).
      # Instrumented tests are not run here; they run locally on an emulator or the Pixel 10a.
      # The release build shows what R8 refuses. Benchmarks need a device, so they are only compiled.
      - name: Check and build in devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3
        with:
          push: never
          # The JaCoCo report task failed once without a clear cause, so coverage gets its own step with one retry.
          # Tests run before it and are not retried, so this cannot hide a flaky test.
          runCmd: >-
            ./gradlew --continue --stacktrace
            ktlintCheck detekt lint test :build-logic:convention:test :build-logic:settings:test assembleDebug assembleDebugAndroidTest
            :app:assembleRelease :benchmark:compileBenchmarkReleaseKotlin
            && (./gradlew --continue --stacktrace coverageReport || ./gradlew --continue --stacktrace coverageReport)

      # Pull requests and main only: every pull request push also triggers a branch run with the same result.
      - name: SonarCloud scan
        if: env.HAS_SONAR_TOKEN == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
