<!-- Renders the Mermaid diagrams, which GitHub shows natively but Jekyll leaves as code blocks. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
  document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid").forEach((block) => {
    const diagram = document.createElement("pre");
    diagram.className = "mermaid";
    diagram.textContent = block.textContent;
    (block.tagName === "CODE" ? block.parentElement : block).replaceWith(diagram);
  });
  mermaid.initialize({ startOnLoad: false });
  await mermaid.run();
</script>
