# Dependabot version updates (D59). Security updates are switched on in the repository settings and are not grouped.
# Minor and patch updates are grouped into one pull request per ecosystem, so a week brings few PRs; major updates
# come one by one, because they usually need code changes (AGP, Kotlin, Compose, Room, ...).
version: 2
updates:
  # gradle/libs.versions.toml, the build-logic plugins and the Gradle wrapper.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # Actions in .github/workflows/, including the SHA-pinned ones.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # The devcontainer base image (eclipse-temurin). JDK 21 is required by Robolectric and the toolchain (D17, D38),
  # so a new major JDK is not proposed. The Android SDK versions in the Dockerfile are updated by hand.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
